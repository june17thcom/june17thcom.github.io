<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choi Rijun&#39;s portfolio</title>
    <!--&#39;는 '을 뜻함-->
    <meta name="description" content="개발자로 취업하고 싶은 사이트" />
    <!--meta 태그의 name 속성은 이 웹사이트의 속성에 대한 설명글. 크롤링 과정에서 매크로들이 수집해 가는 사이트 정보가 이런 류이다.-->
    <meta name="author" content="Rijun" />
    <!--앞부분의 매타 태그 og:는 무조건 써야 되는 거지만, 설명문인 content는 자유롭게 설정 가능하다.
    이하는 소셜 미디어 공유용 메타 태그Open Graph이다.
    배포 시, 등록 후 표시될 설정들. 제목이나 설정, url 형태와 썸네일 등등.-->
    <meta property="og:title" content="최리준의 포트폴리오" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="배포 후 생성된 url" />
    <meta property="og:image" content="배포 후 생성된 이미지 url" />
    <link rel="shortcut icon" href="./cash.ico" type="images/X-icon" />
    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="stylesheet" href="" <script src="https://kit.fontawesome.com/6bfd78dc91.js" crossorigin="anonymous"></script>>
  </head>
  <body></body>
</html>
